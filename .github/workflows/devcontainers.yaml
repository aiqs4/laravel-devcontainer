name: Build and Push Docker Images

on:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4  # Updated to latest version

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3  # Updated to latest version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3  # Updated to latest version

      - name: Cache Docker layers
        uses: actions/cache@v4  # Updated to latest version
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Login to Docker Hub
        uses: docker/login-action@v3  # Updated to latest version
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Verify Docker Login
        run: |
          echo "Checking Docker configuration"
          cat ~/.docker/config.json | grep -v password | grep -v auth

      - name: Build and Push CLI Image
        uses: docker/build-push-action@v5  # Updated to latest version
        with:
          context: ./cli
          file: ./cli/Dockerfile
          # platforms: linux/amd64,linux/arm64  # Added multi-platform support
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/lara-cli:${{ github.sha }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
          # Removed redundant credentials as login-action handles this

      - name: Build and Push FPM Image
        uses: docker/build-push-action@v5  # Updated to latest version
        with:
          context: ./fpm
          file: ./fpm/Dockerfile
          # platforms: linux/amd64,linux/arm64  # Added multi-platform support
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/lara-fpm:${{ github.sha }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
          # Removed redundant credentials

      - name: Build and Push Nginx Image
        uses: docker/build-push-action@v5  # Updated to latest version
        with:
          context: ./nginx
          file: ./nginx/Dockerfile
          # platforms: linux/amd64,linux/arm64  # Added multi-platform support
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/lara-nginx:${{ github.sha }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
          # Removed redundant credentials

      - name: Update Cache Directory
        if: always()
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache || true
